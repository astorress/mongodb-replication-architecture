name: mongodb-replication

services:

  mongodb_lab:
    container_name: 'MongoReplicaLab'
    build:
      context: .
      dockerfile: Dockerfile
      target: img-lab
    volumes:
      - ..:/app
      - mongodb-replication-bashhistory:/commandhistory
    env_file:
      - ../.envs/mongo.env
    working_dir: /app
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - sleep infinity

volumes:
  mongodb-replication-bashhistory:
